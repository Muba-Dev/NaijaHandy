name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend — build + unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run db:generate
      - run: npm run build
      - run: npm test

  backend-e2e:
    name: Backend — e2e tests
    runs-on: ubuntu-latest
    # Requires the DATABASE_URL repository secret.
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      JWT_SECRET: ${{ secrets.JWT_SECRET || 'ci-test-jwt-secret' }}
      PAYSTACK_MOCK: 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run db:generate
      - run: node scripts/deploy-safe.mjs
      - run: npm run db:seed
      - run: npm run test:e2e

  frontend:
    name: Frontend — lint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  frontend-e2e:
    name: Frontend — Playwright e2e
    runs-on: ubuntu-latest
    # Serialize with backend-e2e: both seed the same shared DB, so they cannot run in parallel.
    needs: [backend-e2e]
    # Requires the DATABASE_URL repository secret.
    defaults:
      run:
        working-directory: frontend
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      JWT_SECRET: ${{ secrets.JWT_SECRET || 'ci-test-jwt-secret' }}
      PAYSTACK_MOCK: 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Install backend dependencies
        run: npm ci
        working-directory: backend
      - name: Seed the database
        run: node scripts/deploy-safe.mjs && npm run db:seed
        working-directory: backend
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
